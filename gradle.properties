# 设置 Gradle 命令使用的默认内存。可以被用户或命令行属性覆盖
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#在这里阅读更多内容：https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
#你也可以在这里找到最新版本：https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# 环境属性
# 你可以在这里找到最新版本：https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 Neo 版本一致才能获得有效的构建产物
minecraft_version=1.21.1
# Minecraft 版本范围可以使用任何正式发布的 Minecraft 版本作为边界
# 快照版、预发布版和候选发布版可能无法正确排序
# 因为它们不遵循标准的版本约定
minecraft_version_range=[1.21.1]
# Neo版本必须与Minecraft版本一致才能获得有效产物
neo_version=21.1.244
# 加载器版本范围只能使用 FML 的主版本作为界限
loader_version_range=[1,)

## 模组属性

# 模组的唯一标识符。在英文环境下必须小写。必须符合正则表达式 [a-z][a-z0-9_]{1,63}
# 必须与主模组类中使用 @Mod 注解的字符串常量匹配。
mod_id=commandadjust
# 这个mod的人类可读显示名称
mod_name=Command Adjust
# 模组的许可。请在 https://choosealicense.com/ 查看你的选项。默认是“版权所有”
mod_license=MIT
# 模组版本。请参见 https://semver.org/
mod_version=1.0.1-1.21.1
# 模组的组ID。只有在作为Maven仓库的构件发布时才重要。
# 这应该与模组源码使用的基础包一致。
# 详情见 https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.xltrs.commandadjust
